<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书内容</title>
  <link rel="stylesheet" href="/user/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span>小红书内容</span>
      </div>
    </header>

    <main class="content-area" id="contentArea">
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p>正在加载内容...</p>
      </div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <svg viewBox="0 0 24 24" fill="currentColor" width="64" height="64">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <p>暂无内容</p>
      </div>

      <div class="content-card" id="contentCard" style="display: none;">
        <!-- 图片区域 -->
        <div class="section image-section" id="imageSection">
          <div class="image-container">
            <img id="contentImage" src="" alt="内容图片" />
          </div>
          <button class="save-btn" onclick="saveImage()" title="保存图片">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
            </svg>
            <span>保存图片</span>
          </button>
        </div>

        <!-- 标题区域 -->
        <div class="section title-section">
          <div class="section-label">标题</div>
          <div class="section-content">
            <p class="title-text" id="titleText"></p>
            <button class="copy-btn" onclick="copyTitle()" title="复制标题">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
              <span>复制</span>
            </button>
          </div>
        </div>

        <!-- 正文区域 -->
        <div class="section content-section">
          <div class="section-label">正文</div>
          <div class="section-content">
            <p class="content-text" id="contentText"></p>
            <button class="copy-btn" onclick="copyContent()" title="复制正文">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
              <span>复制</span>
            </button>
          </div>
        </div>

        <!-- 话题区域 -->
        <div class="section topics-section">
          <div class="section-label">话题</div>
          <div class="topics-container" id="topicsContainer"></div>
          <div class="topics-actions">
            <button class="copy-btn copy-all-topics" onclick="copyAllTopics()" title="复制所有话题">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
              </svg>
              <span>复制全部话题</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast 提示 -->
    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
      <span id="toastMessage">已复制</span>
    </div>
  </div>

  <script src="/user/app.js"></script>
</body>
</html>
